[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-svm"
version = "1.0.5"
authors = [
  { name="Mikhail Onischuck" },
]
description = "Simple symbolic Virtual Machine in Python and Z3"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
  "z3-solver>=4.0.0,<4.15",
]

[project.urls]
Homepage = "https://github.com/dog-m/micro-svm-engine"
Issues = "https://github.com/dog-m/micro-svm-engine/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["docs", "tests", "micro_svm.tests*"]

