[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-svm"
version = "1.0.0"
authors = [
  { name="Mikhail Onischuck" },
]
description = "Symbolic Virtual Machine for defect detection"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/dog-m/micro-svm-engine"
Issues = "https://github.com/dog-m/micro-svm-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

